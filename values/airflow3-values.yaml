executor: "CeleryExecutor"
# Default airflow tag to deploy
defaultAirflowTag: "3.2.1"
# Airflow version (Used to make some decisions based on Airflow Version being deployed)
airflowVersion: "3.2.1"
apiServer:
  service:
    type: LoadBalancer
webserver:
  defaultUser:
    enabled: true
    username: airflow
    password: airflow
    role: Admin

postgresql:
  enabled: false

dags:
  persistence:
    enabled: true
    existingClaim: radiant-dags-pvc
#    subPath: ""
  gitSync:
    enabled: false

logs:
  persistence:
    enabled: true
    existingClaim: radiant-logs-pvc

# Using a manually built docker image for now. See instructions in README.
images:
  airflow:
    repository: ghcr.io/radiant-network/radiant-airflow3
    tag: 1.0.10
    pullPolicy: IfNotPresent

data:
  metadataConnection:
    user: postgres
    pass: postgres
    protocol: postgresql
    host: postgres
    port: 5432
    db: airflow


extraEnv: |
  - name: PYTHONPATH
    value: /opt/airflow/dags
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_ACCESS_KEY_ID
    value: admin
  - name: AWS_SECRET_ACCESS_KEY
    value: password
  - name: AWS_ENDPOINT_URL
    value: "http://radiant-minio:9000"
  - name: AWS_ALLOW_HTTP
    value: "true"
  - name: PYICEBERG_CATALOG__DEFAULT__URI
    value: "http://radiant-polaris:8181/api/catalog"
  - name: PYICEBERG_CATALOG__DEFAULT__S3__ENDPOINT
    value: "http://radiant-minio:9000"
  - name: PYICEBERG_CATALOG__DEFAULT__WAREHOUSE
    value: "polaris"
  - name: PYICEBERG_CATALOG__DEFAULT__CREDENTIAL
    value: "root:password"
  - name: PYICEBERG_CATALOG__DEFAULT__SCOPE
    value: "PRINCIPAL_ROLE:CATALOG_MANAGE_CONTENT"
  - name: PYICEBERG_CATALOG__DEFAULT__HEADER__Polaris-Realm
    value: "radiant"
  - name: PYICEBERG_CATALOG__DEFAULT__HEADER__X-Iceberg-Access-Delegation
    value: ""
  - name: PYICEBERG_CATALOG__DEFAULT__OAUTH2_SERVER_URI
    value: "http://radiant-polaris:8181/api/catalog/v1/oauth/tokens"
  - name: RADIANT_ICEBERG_NAMESPACE
    value: "radiant"
  - name: AIRFLOW_CONN_STARROCKS_CONN
    value: "mysql://root@radiant-starrocks-fe:9030/radiant"
  - name: AIRFLOW_CONN_RADIANT_POSTGRES_CONN
    value: "postgresql://postgres:postgres@postgres:5432/radiant"
  - name: RADIANT_TASK_OPERATOR_KUBERNETES_NAMESPACE
    value: radiant
  - name: RADIANT_TASK_OPERATOR_IMAGE
    value: "ghcr.io/radiant-network/radiant-airflow-task-operator:latest"
  - name: RADIANT_DBT_OPERATOR_IMAGE
    value: "ghcr.io/radiant-network/radiant-airflow-dbt-operator:latest"
  - name: RADIANT_TASK_OPERATOR_PYTHONPATH
    value: "/opt/radiant"
  - name: RADIANT_DBT_S3_WORKSPACE
    value: "warehouse"
  # Shrink the TableAccumulator flush threshold, which is what sets an extraction task's memory
  # floor -- independently of how small the VCF is. At the 500MB default a buffer only flushes at
  # 500MB, pa.concat_tables briefly holds both the old and concatenated copy (~1GiB for a single
  # buffer), and three buffers are live at once, so every writer wanted 2-2.5GiB and a 1Gi limit
  # OOMKilled (exit 137) on the 21M SH032 VCF. At 64MB the peak is roughly 3x64MB of Arrow plus a
  # transient copy, so a few hundred MB on top of the interpreter/pyarrow/cyvcf2 baseline.
  #
  # Local only. The 500MB default is deliberately just under Iceberg's
  # WRITE_TARGET_FILE_SIZE_BYTES_DEFAULT; lowering it in a real deployment trades memory for a lot
  # of small parquet files.
  - name: RADIANT_PARQUET_FILE_SIZE_MB
    value: "'64'"
  # Sized for the 64MB threshold above -- raise these together if that goes back up.
  - name: RADIANT_TASK_OPERATOR_SNV_CPU
    value: "500m"
  - name: RADIANT_TASK_OPERATOR_SNV_MEMORY
    value: "512Mi"
  - name: RADIANT_TASK_OPERATOR_SNV_MEMORY_LIMIT
    value: "1Gi"
  - name: RADIANT_TASK_OPERATOR_CNV_CPU
    value: "250m"
  - name: RADIANT_TASK_OPERATOR_METADATA_CPU
    value: "250m"
  - name: RADIANT_TASK_OPERATOR_METADATA_MEMORY
    value: "512Mi"
