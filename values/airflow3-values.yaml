executor: "CeleryExecutor"
# Default airflow tag to deploy
defaultAirflowTag: "3.2.1"
# Airflow version (Used to make some decisions based on Airflow Version being deployed)
airflowVersion: "3.2.1"
apiServer:
  service:
    type: LoadBalancer
webserver:
  defaultUser:
    enabled: true
    username: airflow
    password: airflow
    role: Admin

postgresql:
  enabled: false

dags:
  persistence:
    enabled: true
    existingClaim: radiant-dags-pvc
#    subPath: ""
  gitSync:
    enabled: false

logs:
  persistence:
    enabled: true
    existingClaim: radiant-logs-pvc

# Using a manually built docker image for now. See instructions in README.
images:
  airflow:
    repository: ghcr.io/radiant-network/radiant-airflow3
    tag: 1.0.10
    pullPolicy: IfNotPresent

data:
  metadataConnection:
    user: postgres
    pass: postgres
    protocol: postgresql
    host: postgres
    port: 5432
    db: airflow


extraEnv: |
  - name: PYTHONPATH
    value: /opt/airflow/dags
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_ACCESS_KEY_ID
    value: admin
  - name: AWS_SECRET_ACCESS_KEY
    value: password
  - name: AWS_ENDPOINT_URL
    value: "http://radiant-minio:9000"
  - name: AWS_ALLOW_HTTP
    value: "true"
  - name: PYICEBERG_CATALOG__DEFAULT__URI
    value: "http://radiant-polaris:8181/api/catalog"
  - name: PYICEBERG_CATALOG__DEFAULT__S3__ENDPOINT
    value: "http://radiant-minio:9000"
  - name: PYICEBERG_CATALOG__DEFAULT__WAREHOUSE
    value: "polaris"
  - name: PYICEBERG_CATALOG__DEFAULT__CREDENTIAL
    value: "root:password"
  - name: PYICEBERG_CATALOG__DEFAULT__SCOPE
    value: "PRINCIPAL_ROLE:CATALOG_MANAGE_CONTENT"
  - name: PYICEBERG_CATALOG__DEFAULT__HEADER__Polaris-Realm
    value: "radiant"
  - name: PYICEBERG_CATALOG__DEFAULT__HEADER__X-Iceberg-Access-Delegation
    value: ""
  - name: PYICEBERG_CATALOG__DEFAULT__OAUTH2_SERVER_URI
    value: "http://radiant-polaris:8181/api/catalog/v1/oauth/tokens"
  - name: RADIANT_ICEBERG_NAMESPACE
    value: "radiant"
  - name: AIRFLOW_CONN_STARROCKS_CONN
    value: "mysql://root@radiant-starrocks-fe:9030/radiant"
  - name: AIRFLOW_CONN_RADIANT_POSTGRES_CONN
    value: "postgresql://postgres:postgres@postgres:5432/radiant"
  - name: RADIANT_TASK_OPERATOR_KUBERNETES_NAMESPACE
    value: radiant
  - name: RADIANT_TASK_OPERATOR_IMAGE
    value: "ghcr.io/radiant-network/radiant-airflow-task-operator:latest"
  - name: RADIANT_DBT_OPERATOR_IMAGE
    value: "ghcr.io/radiant-network/radiant-airflow-dbt-operator:latest"
  - name: RADIANT_TASK_OPERATOR_PYTHONPATH
    value: "/opt/radiant"
  - name: RADIANT_DBT_S3_WORKSPACE
    value: "warehouse"
  # Shrink the TableAccumulator flush threshold, which is what sets an extraction task's memory
  # floor -- independently of how small the VCF is. At the 500MB default a buffer only flushes at
  # 500MB, pa.concat_tables briefly holds both the old and concatenated copy (~1GiB for a single
  # buffer), and three buffers are live at once, so every writer wanted 2-2.5GiB and a 1Gi limit
  # OOMKilled (exit 137) on the 21M SH032 VCF. At 64MB the peak is roughly 3x64MB of Arrow plus a
  # transient copy, so a few hundred MB on top of the interpreter/pyarrow/cyvcf2 baseline.
  #
  # Local only. The 500MB default is deliberately just under Iceberg's
  # WRITE_TARGET_FILE_SIZE_BYTES_DEFAULT; lowering it in a real deployment trades memory for a lot
  # of small parquet files.
  - name: RADIANT_PARQUET_FILE_SIZE_MB
    value: "'64'"
  # Sized for the 64MB threshold above -- raise these together if that goes back up.
  - name: RADIANT_TASK_OPERATOR_SNV_CPU
    value: "500m"
  - name: RADIANT_TASK_OPERATOR_SNV_MEMORY
    value: "512Mi"
  - name: RADIANT_TASK_OPERATOR_SNV_MEMORY_LIMIT
    value: "1Gi"
  - name: RADIANT_TASK_OPERATOR_CNV_CPU
    value: "250m"
  - name: RADIANT_TASK_OPERATOR_METADATA_CPU
    value: "250m"
  - name: RADIANT_TASK_OPERATOR_METADATA_MEMORY
    value: "512Mi"

  # ---------------------------------------------------------------------------
  # Open Datalake (radiant-open-datalake) -- the unified sandbox runs both DAG
  # sets in this one Airflow. The AWS_* vars above are shared: they already point
  # at radiant-minio, which is the Open Datalake's S3 too.
  # ---------------------------------------------------------------------------
  # boto3 reads AWS_DEFAULT_REGION, not AWS_REGION; the ECS/S3 hooks need it.
  - name: AWS_DEFAULT_REGION
    value: us-east-1
  - name: AIRFLOW_CONN_OPENDATALAKE_S3
    value: '{
        "conn_type": "Amazon Web Services",
        "login": "admin",
        "password": "password",
        "host": "radiant-minio",
        "port": 9000,
        "extra": {
            "aws_access_key_id": "admin",
            "aws_secret_access_key": "password",
            "endpoint_url": "http://radiant-minio:9000",
            "region_name": "us-east-1",
            "aws_allow_http": true,
            "verify": false
        }
    }'
  - name: OPENDATALAKE_ENVIRONMENT
    value: "dev"
  # SHARED CONSTANT -- bucket `opendatalake-dev` / root `s3://opendatalake-dev/iceberg` is
  # hardcoded in four places that must agree. A mismatch surfaces as a 404 NoSuchBucket at Iceberg
  # write time, not as a config error:
  #   k8s/minio/radiant-minio-bucket-init-job.yaml       creates the bucket
  #   k8s/polaris/init/radiant-polaris-init-opendatalake-catalog-job.yaml
  #                                                      CATALOG_WAREHOUSE / allowedLocations
  #   docker/opendatalake-spark/Dockerfile               sed rewrite of the baked config
  #   values/airflow3-values.yaml                        <- here
  - name: OPENDATALAKE_RAW_BUCKET
    value: "opendatalake-dev"
  # Iceberg namespace + warehouse root, passed to the Spark job as --database / --warehouse.
  # --warehouse REPLACES the storage root in the ETL config (WapETLP.withStorageRoot); the table
  # then lands at `<warehouse>/<dataset path>`, e.g. .../reference/normalized/clinvar_v1.
  #
  # It MUST include the `/reference` namespace segment. Polaris derives a per-namespace location
  # (default-base-location + namespace name) and validates table locations against THAT, not
  # against the catalog's broader allowedLocations:
  #     catalog   allowedLocations : s3://opendatalake-dev/iceberg
  #     namespace reference location: s3://opendatalake-dev/iceberg/reference/   <- enforced
  # Dropping the segment writes to .../iceberg/normalized/<table> and Polaris rejects it with
  # "ForbiddenException: Invalid locations ... is not in the list of allowed locations".
  # Only the scheme differs from opendatalake/lib/config.py's default: s3:// not s3a://, because
  # the allowed locations above are s3:// and the prefix check is textual.
  - name: OPENDATALAKE_EMR_GLUE_DATABASE
    value: "reference"
  - name: OPENDATALAKE_EMR_WAREHOUSE_S3
    value: "s3://opendatalake-dev/iceberg/reference"
  # Sandbox operator swaps (see opendatalake/operators/ in this repo).
  - name: OPENDATALAKE_TASK_OPERATOR_KUBERNETES_NAMESPACE
    value: radiant
  - name: OPENDATALAKE_TASK_OPERATOR_IMAGE
    value: "ghcr.io/radiant-network/opendatalake-airflow-task-operator:latest"
  - name: OPENDATALAKE_SPARK_IMAGE
    value: "ghcr.io/radiant-network/opendatalake-spark:latest"
  # The Spark pod shares this minikube with StarRocks CN (4Gi), the FE and the Airflow pods, so it
  # gets less than in the standalone Open Datalake sandbox. Raise together with the driver memory
  # if an import OOMKills (exit 137).
  - name: OPENDATALAKE_SPARK_MEMORY
    value: "2Gi"
  - name: OPENDATALAKE_SPARK_MEMORY_LIMIT
    value: "3Gi"
  - name: OPENDATALAKE_SPARK_DRIVER_MEMORY
    value: "2g"
  # Secrets for the download DAG, needed only by the SpliceAI and OMIM sources. Left EMPTY on
  # purpose: SpliceAiConfig.missing() / OmimConfig.missing() treat "" as unset and raise an
  # AirflowException naming the variable, whereas a placeholder string is sent to the remote as a
  # real credential and comes back as an opaque auth failure. Fill in to use those two sources.
  - name: OPENDATALAKE_SPLICEAI_ACCESS_TOKEN
    value: ""
  - name: OPENDATALAKE_OMIM_DOWNLOAD_KEY
    value: ""
  # ECS is not supported in the sandbox, but the ECS operator module is imported at DAG-parse time
  # unless the k8s swap is applied. Kept so the DAGs parse either way.
  - name: OPENDATALAKE_ECS_CLUSTER
    value: "ecs-cluster"
  - name: OPENDATALAKE_ECS_SUBNETS
    value: "subnet-123,subnet-456"
  - name: OPENDATALAKE_ECS_SECURITY_GROUPS
    value: "sg-123,sg-456"
  - name: OPENDATALAKE_TASK_OPERATOR_TASK_DEFINITION
    value: "opendatalake-task-def"
  - name: OPENDATALAKE_TASK_OPERATOR_LOG_GROUP
    value: "opendatalake-ecs-logs"
  - name: OPENDATALAKE_TASK_OPERATOR_LOG_REGION
    value: "us-east-1"
  - name: OPENDATALAKE_TASK_OPERATOR_LOG_PREFIX
    value: "opendatalake"
