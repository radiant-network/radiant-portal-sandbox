apiVersion: v1
kind: Secret
metadata:
  labels:
    app: radiant-toolbox
  name: radiant-toolbox-secret
type: Opaque
stringData:
  # Loaded via envFrom by the toolbox DAG's pod (RADIANT_TOOLBOX_OPERATOR_SECRET_NAME default).
  # Same env as the API -- keep in sync with k8s/api/radiant-api-deployments.yml.
  DB_HOST: radiant-starrocks-fe
  DB_PORT: "9030"
  DB_NAME: radiant
  DB_USERNAME: root
  DB_PASSWORD: ""
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: radiant
  PGUSER: postgres
  PGPASSWORD: postgres
  PGSSLMODE: disable
  # create-user / create-tenant create Keycloak users through this service-account client.
  KEYCLOAK_HOST: http://radiant-keycloak:8282
  KEYCLOAK_REALM: Radiant
  KEYCLOAK_ADMIN_CLIENT_ID: radiant-admin-cli
  KEYCLOAK_ADMIN_CLIENT_SECRET: radiant-admin-secret
  # Ranger admin from k8s/ranger/. Policies are only enforced when the FE is patched with
  # k8s/ranger/enforce/; otherwise StarRocks keeps its native access control.
  RANGER_URL: http://radiant-ranger:6080
  RANGER_ADMIN_USER: admin
  RANGER_ADMIN_PASSWORD: rangerR0cks!
  # Baked into every StarRocks JWT user that create-user provisions (CREATE USER IF NOT EXISTS, so
  # an existing user keeps whatever it was created with). Only used when the API reads through
  # mysql-proxy (k8s/ranger/enforce/); harmless otherwise. Issuer is KC_HOSTNAME + port.
  STARROCKS_JWT_JWKS_URL: http://radiant-keycloak:8282/realms/Radiant/protocol/openid-connect/certs
  STARROCKS_JWT_REQUIRED_ISSUER: http://radiant-keycloak:8282/realms/Radiant
  STARROCKS_JWT_REQUIRED_AUDIENCE: radiant
