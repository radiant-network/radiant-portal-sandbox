apiVersion: v1
kind: Secret
metadata:
  labels:
    app: radiant-toolbox
  name: radiant-toolbox-secret
type: Opaque
stringData:
  # Loaded via envFrom by the toolbox DAG's pod (RADIANT_TOOLBOX_OPERATOR_SECRET_NAME default).
  # Same env as the API -- keep in sync with k8s/api/radiant-api-deployments.yml.
  DB_HOST: radiant-starrocks-fe
  DB_PORT: "9030"
  DB_NAME: radiant
  DB_USERNAME: root
  DB_PASSWORD: ""
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: radiant
  PGUSER: postgres
  PGPASSWORD: postgres
  PGSSLMODE: disable
  # No Ranger in the sandbox: refresh-tenants' masking step (and the Ranger parts of
  # create-tenant / create-user) fail by design. Views and gene panel MVs still apply.
  RANGER_URL: ""
  RANGER_ADMIN_USER: ""
  RANGER_ADMIN_PASSWORD: ""
