apiVersion: batch/v1
kind: Job
metadata:
  name: radiant-polaris-init-opendatalake-catalog
spec:
  # The realm bootstrap inside polaris-init.sh is idempotent but not concurrency-safe; the init
  # container below serializes this job behind radiant-polaris-init-catalog, and the retries cover
  # the rest.
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      initContainers:
        # Both catalog jobs are applied together (`kubectl apply -f k8s/polaris/init`), and both call
        # `polaris-admin-tool bootstrap` on the same realm. Wait until the realm answers with a token
        # -- which proves radiant-polaris-init-catalog has already bootstrapped it -- so this job's
        # own bootstrap takes the "already bootstrapped" path instead of racing. This orders the two
        # bootstraps only; the other job may still be creating its own catalog, which is independent
        # of this one.
        - name: wait-for-polaris-realm
          image: curlimages/curl:8.11.1
          env:
            - name: CLIENT_ID
              value: "root"
            - name: CLIENT_SECRET
              value: "password"
            - name: REALM
              value: "radiant"
            - name: POLARIS_SERVICE_HOST
              value: "radiant-polaris:8181"
            # 60 x 5s = 5 min, comfortably longer than a cold Polaris start + realm bootstrap.
            - name: MAX_ATTEMPTS
              value: "60"
            - name: SLEEP_SECONDS
              value: "5"
          command:
            - /bin/sh
            - -c
            - |
              # Bounded: an unbounded `until` loop would leave the pod in Init:0/1 forever if
              # radiant-polaris-init-catalog never runs or fails, and backoffLimit would never
              # engage because the init container neither succeeds nor fails.
              attempt=0
              until curl -sf -X POST "http://$POLARIS_SERVICE_HOST/api/catalog/v1/oauth/tokens" \
                    -H "Polaris-Realm: $REALM" \
                    -H 'Content-Type: application/x-www-form-urlencoded' \
                    -d "grant_type=client_credentials&client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&scope=PRINCIPAL_ROLE:ALL" \
                    | grep -q access_token; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                  echo "❌ Polaris realm $REALM did not become available after $MAX_ATTEMPTS attempts."
                  echo "   Check that radiant-polaris is running and radiant-polaris-init-catalog completed."
                  exit 1
                fi
                echo "Waiting for Polaris realm $REALM to be bootstrapped (attempt $attempt/$MAX_ATTEMPTS)..."
                sleep "$SLEEP_SECONDS"
              done
              echo "Polaris realm $REALM is ready."
      containers:
        - name: polaris-admin-tool
          image: apache/polaris-admin-tool:1.3.0-incubating
          env:
            # Necessary for boostrapping the realm
            - name: QUARKUS_DATASOURCE_USERNAME
              value: "postgres"
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: "postgres"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://postgres:5432/polaris"

            # Script parameters. Same script/ConfigMap as radiant-polaris-init-catalog -- only the
            # catalog, warehouse and namespace differ, so the Open Datalake ETL writes Iceberg tables
            # into its own catalog exactly as it does on AWS.
            - name: CLIENT_ID
              value: "root"
            - name: CLIENT_SECRET
              value: "password"
            - name: REALM
              value: "radiant"
            - name: CATALOG_NAME
              value: "opendatalake"
            # SHARED CONSTANT -- bucket `opendatalake-dev` / root `s3://opendatalake-dev/iceberg`
            # is hardcoded in four places that must agree. A mismatch surfaces as a 404
            # NoSuchBucket at Iceberg write time, not as a config error:
            #   k8s/minio/radiant-minio-bucket-init-job.yaml       creates the bucket
            #   k8s/polaris/init/radiant-polaris-init-opendatalake-catalog-job.yaml
            #                                                      <- here, allowedLocations
            #   docker/opendatalake-spark/Dockerfile               sed rewrite of the baked config
            #   values/airflow3-values.yaml                        OPENDATALAKE_RAW_BUCKET,
            #                                                      OPENDATALAKE_EMR_WAREHOUSE_S3
            - name: CATALOG_WAREHOUSE
              value: "s3://opendatalake-dev/iceberg"
            - name: POLARIS_SERVICE_HOST
              value: "radiant-polaris:8181"
            # Iceberg namespace the Open Datalake ETL writes its reference tables into.
            - name: NAMESPACE
              value: "reference"
          command: ["/bin/sh", "/init/polaris-init.sh"]
          volumeMounts:
            - name: init-script
              mountPath: /init
      volumes:
        - name: init-script
          configMap:
            name: radiant-polaris-init-catalog-script
