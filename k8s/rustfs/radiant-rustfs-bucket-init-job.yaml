apiVersion: batch/v1
kind: Job
metadata:
  name: radiant-rustfs-bucket-init-job
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-rustfs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z radiant-rustfs 9000; do
                echo "Waiting for RustFS..."
                sleep 2
              done
      containers:
        - name: create-bucket
          # Plain aws-cli rather than the MinIO client: RustFS is S3-compatible, and this keeps the
          # sandbox off Docker Hub's minio/* repositories, which no longer serve anonymous pulls.
          image: amazon/aws-cli:2.31.19
          command:
            - sh
            - -c
            - |
              set -e
              # create-bucket is not idempotent -- it returns BucketAlreadyOwnedByYou on a re-run --
              # so check first and let `set -e` catch anything that is a genuine failure.
              for b in starrocks warehouse vcf opendatalake-dev; do
                if aws --endpoint-url "$AWS_ENDPOINT_URL" s3api head-bucket --bucket "$b" 2>/dev/null; then
                  echo "Bucket $b already exists"
                else
                  aws --endpoint-url "$AWS_ENDPOINT_URL" s3api create-bucket --bucket "$b"
                  echo "Bucket $b created"
                fi
              done
              aws --endpoint-url "$AWS_ENDPOINT_URL" s3api list-buckets \
                --query 'Buckets[].Name' --output text
          env:
            - name: AWS_ENDPOINT_URL
              value: "http://radiant-rustfs:9000"
            - name: AWS_ACCESS_KEY_ID
              value: "admin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "password"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
# Buckets, and who writes them:
#   starrocks        StarRocks shared-data storage volume (all internal tables)
#   warehouse        Iceberg warehouse for the `polaris` catalog + the seed parquet/VCF input
#   vcf              seed VCFs read by the Radiant import DAGs
#   opendatalake-dev Open Datalake raw landing (raw/landing/<source>/<version>) + Iceberg
#                    warehouse (iceberg/reference)
#
# SHARED CONSTANT -- bucket `opendatalake-dev` / root `s3://opendatalake-dev/iceberg` is hardcoded
# in four places that must agree. A mismatch surfaces as a 404 NoSuchBucket at Iceberg write time,
# not as a config error:
#   k8s/rustfs/radiant-rustfs-bucket-init-job.yaml     <- here, creates the bucket
#   k8s/polaris/init/radiant-polaris-init-opendatalake-catalog-job.yaml
#                                                      CATALOG_WAREHOUSE / allowedLocations
#   docker/opendatalake-spark/Dockerfile               sed rewrite of the baked config
#   values/airflow3-values.yaml                        OPENDATALAKE_RAW_BUCKET,
#                                                      OPENDATALAKE_EMR_WAREHOUSE_S3
