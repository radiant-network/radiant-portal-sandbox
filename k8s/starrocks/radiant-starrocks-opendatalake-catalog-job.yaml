apiVersion: batch/v1
kind: Job
metadata:
  name: radiant-starrocks-opendatalake-catalog-job
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-starrocks
          image: starrocks/cn-ubuntu:4.0.13
          command: ['sh', '-c', 'until /usr/bin/mysql -u root -h radiant-starrocks-fe -P 9030 -e "SHOW COMPUTE NODES\G" |grep "Alive: true"; do echo waiting for starrocks; sleep 2; done']

      containers:
        - name: init-opendatalake-catalog
          image: starrocks/cn-ubuntu:4.0.13
          command:
            - sh
            - -c
            - |
              echo 'Create opendatalake iceberg catalog...' && \
              mysql -h radiant-starrocks-fe -P 9030 -u root -e "
                CREATE EXTERNAL CATALOG IF NOT EXISTS 'opendatalake_catalog'
                COMMENT 'External catalog to the Open Datalake Iceberg tables (Polaris on MinIO)'
                PROPERTIES
                (
                'type'='iceberg',
                'iceberg.catalog.type'='rest',
                'iceberg.catalog.uri'='http://radiant-polaris:8181/api/catalog',
                'iceberg.catalog.warehouse'='opendatalake',
                'iceberg.catalog.security'='oauth2',
                'iceberg.catalog.oauth2.credential'='root:password',
                'iceberg.catalog.oauth2.scope'='PRINCIPAL_ROLE:CATALOG_MANAGE_CONTENT',
                'aws.s3.region'='us-east-1',
                'aws.s3.access_key'='admin',
                'aws.s3.secret_key'='password',
                'aws.s3.endpoint'='http://radiant-minio:9000',
                'aws.s3.enable_path_style_access'='true',
                'iceberg.catalog.vended-credentials-enabled'='false',
                'client.factory'='com.starrocks.connector.share.iceberg.IcebergAwsClientFactory'
                );"
      restartPolicy: OnFailure
